services:
  postgres:
    image: postgres:16-alpine
    container_name: sharedeal_postgres
    restart: always
    environment:
      POSTGRES_USER: sharedeal_user
      POSTGRES_PASSWORD: sharedeal_password
      POSTGRES_DB: sharedeal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
